<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Payment Bill - TCM Guide Gujarat</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  font-family:
    Arial,
    "Noto Sans Gujarati",
    sans-serif;

  background:#f1f5f9;

  color:#1f2937;

}

.bill-container{

  width:100%;

  max-width:800px;

  margin:30px auto;

  background:#ffffff;

  padding:35px;

  border-radius:12px;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.10);

}

.bill-header{

  text-align:center;

  border-bottom:
    2px solid #1e293b;

  padding-bottom:20px;

  margin-bottom:25px;

}

.bill-header h1{

  margin:0;

  font-size:28px;

  color:#0f172a;

}

.bill-header h2{

  margin:8px 0 0;

  font-size:17px;

  font-weight:500;

  color:#475569;

}

.bill-title{

  text-align:center;

  margin-bottom:25px;

}

.bill-title span{

  display:inline-block;

  padding:8px 25px;

  border-radius:6px;

  background:#e2e8f0;

  font-size:18px;

  font-weight:700;

}

.bill-table{

  width:100%;

  border-collapse:collapse;

  margin-top:10px;

}

.bill-table th,
.bill-table td{

  border:
    1px solid #cbd5e1;

  padding:12px;

  text-align:left;

  font-size:14px;

}

.bill-table th{

  width:40%;

  background:#f8fafc;

  font-weight:700;

}

.amount-row td{

  font-size:17px;

  font-weight:700;

}

.status-paid{

  color:#166534;

  font-weight:700;

}

.bill-footer{

  margin-top:25px;

  padding-top:18px;

  border-top:
    1px solid #cbd5e1;

  font-size:13px;

  color:#64748b;

  line-height:1.6;

}

.print-button{

  display:block;

  margin:25px auto 0;

  height:44px;

  padding:0 25px;

  border:none;

  border-radius:7px;

  background:#2563eb;

  color:white;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

}

.print-button:hover{

  background:#1d4ed8;

}

.error-box{

  max-width:600px;

  margin:100px auto;

  padding:25px;

  background:white;

  border-radius:10px;

  text-align:center;

  color:#dc2626;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.10);

}


/* =====================================================
   PRINT
===================================================== */

@media print{

  body{

    background:white;

    padding:0;

  }

  .bill-container{

    max-width:none;

    margin:0;

    padding:15px;

    box-shadow:none;

    border-radius:0;

  }

  .print-button{

    display:none;

  }

  .bill-footer{

    color:#334155;

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  body{

    padding:10px;

  }

  .bill-container{

    margin:10px auto;

    padding:18px;

  }

  .bill-header h1{

    font-size:23px;

  }

  .bill-header h2{

    font-size:14px;

  }

  .bill-table th,
  .bill-table td{

    padding:9px;

    font-size:13px;

  }

  .bill-table th{

    width:42%;

  }

}

</style>

</head>


<body>


<div
  id="billArea">

</div>


<script>


/* =====================================================
   GET URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const revenueYear =
  params.get("year") || "-";


const email =
  params.get("email") || "-";


const village =
  params.get("village") || "-";


const taluka =
  params.get("taluka") || "-";


const district =
  params.get("district") || "-";


const requestDate =
  params.get("date") || "-";


const amount =
  params.get("amount") || "799";


/* =====================================================
   BASIC VALIDATION
===================================================== */

if(
  revenueYear === "-" &&
  email === "-" &&
  village === "-" &&
  taluka === "-" &&
  district === "-"
){

  document.getElementById(
    "billArea"
  ).innerHTML = `

    <div class="error-box">

      <h2>
        Bill Information Not Found
      </h2>

      <p>
        Please open the Bill using the link received by email.
      </p>

    </div>

  `;

}


/* =====================================================
   CREATE BILL
===================================================== */

else{

  document.getElementById(
    "billArea"
  ).innerHTML = `

    <div class="bill-container">


      <div class="bill-header">

        <h1>
          TCM GUIDE GUJARAT
        </h1>

        <h2>
          Sahajanand Web Service
        </h2>
        <h2>
          Email: tcmguidegujarat@gmail.com
        </h2>
      </div>


      <div class="bill-title">

        <span>
          PAYMENT RECEIPT
        </span>

      </div>


      <table class="bill-table">


        <tr>

          <th>
            Revenue Year
          </th>

          <td>
            ${escapeHTML(revenueYear)}
          </td>

        </tr>


        <tr>

          <th>
            Service
          </th>

          <td>
            Sahajanand Web Services
          </td>

        </tr>


        <tr>

          <th>
            Quantity
          </th>

          <td>
            01
          </td>

        </tr>


        <tr class="amount-row">

          <th>
            Paid Amount
          </th>

          <td>
            Rs. ${escapeHTML(amount)}/-
          </td>

        </tr>


        <tr>

          <th>
            Email ID
          </th>

          <td>
            ${escapeHTML(email)}
          </td>

        </tr>


        <tr>

          <th>
            Village
          </th>

          <td>
            ${escapeHTML(village)}
          </td>

        </tr>


        <tr>

          <th>
            Taluka
          </th>

          <td>
            ${escapeHTML(taluka)}
          </td>

        </tr>


        <tr>

          <th>
            District
          </th>

          <td>
            ${escapeHTML(district)}
          </td>

        </tr>


        <tr>

          <th>
            Request Date & Time
          </th>

          <td>
            ${escapeHTML(requestDate)}
          </td>

        </tr>


        <tr>

          <th>
            Payment Status
          </th>

          <td class="status-paid">
            PAID
          </td>

        </tr>


      </table>


      <div class="bill-footer">

        This is a system generated payment receipt.

        <br>

        Signature is not required.

        <br><br>

        Thank you for using TCM Guide Gujarat.

        <br>

        TCM Guide Gujarat

        <br>

        Sahajanand Web Services

        <br>

        Revenue Hisabbandh Management

      </div>


      <button
        class="print-button"
        onclick="window.print()">

        🖨 Print Bill

      </button>


    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
