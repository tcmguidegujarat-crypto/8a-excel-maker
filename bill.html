<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Invoice - Mahamantra Web Services</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  background:#f3f4f6;

  font-family:
    Arial,
    "Noto Sans Gujarati",
    sans-serif;

  color:#334155;

}


/* =====================================================
   INVOICE
===================================================== */

.invoice{

  width:100%;

  max-width:900px;

  margin:20px auto;

  background:#ffffff;

  padding:45px 50px;

  box-shadow:
    0 4px 20px
    rgba(0,0,0,.10);

}


/* =====================================================
   HEADER
===================================================== */

.invoice-header{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:30px;

  padding-bottom:10px;

}


/* LEFT HEADER */

.company-section{

  display:flex;

  align-items:flex-start;

  gap:15px;

}


/* LOGO */

.company-logo{

  width:95px;

  height:95px;

  object-fit:contain;

  flex-shrink:0;

}


/* COMPANY */

.company-info{

  padding-top:2px;

}

.company-name{

  margin:0;

  font-size:30px;

  line-height:1.1;

  font-weight:800;

  color:#102a43;

  letter-spacing:.3px;

}

.company-subtitle{

  margin-top:8px;

  font-size:15px;

  font-weight:700;

  color:#173b5f;

}

.company-owner{

  margin-top:5px;

  font-size:13px;

  font-weight:600;

  color:#374151;

}

.company-address{

  margin-top:5px;

  font-size:12px;

  color:#475569;

}

.company-email{

  margin-top:5px;

  font-size:12px;

  color:#475569;

}


/* =====================================================
   INVOICE RIGHT
===================================================== */

.invoice-title{

  text-align:right;

  min-width:180px;

}

.invoice-title h1{

  margin:0;

  font-size:31px;

  letter-spacing:1px;

  color:#9ab1c7;

  font-weight:800;

}

.invoice-details{

  margin-top:12px;

  font-size:12px;

  font-weight:700;

  color:#475569;

}

.invoice-details div{

  margin-top:8px;

}

.invoice-details span{

  display:inline-block;

  min-width:75px;

}


/* =====================================================
   LINE
===================================================== */

.header-line{

  height:2px;

  background:#102a43;

  margin-top:8px;

  margin-bottom:18px;

}


/* =====================================================
   VILLAGE DETAILS
===================================================== */

.location-box{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:15px;

  border:1px solid #cbd5e1;

  border-radius:4px;

  padding:9px 12px;

  margin-bottom:18px;

  background:#fafafa;

}

.location-item{

  font-size:13px;

  font-weight:700;

  color:#263746;

}

.location-value{

  font-weight:500;

  margin-left:5px;

  border-bottom:1px dotted #64748b;

  display:inline-block;

  min-width:120px;

}


/* =====================================================
   ITEMS TABLE
===================================================== */

.items-table{

  width:100%;

  border-collapse:collapse;

  margin-top:5px;

}

.items-table th{

  background:#102a43;

  color:#ffffff;

  padding:11px 12px;

  font-size:13px;

  text-align:left;

}

.items-table th:nth-child(1){

  width:60px;

}

.items-table th:nth-child(3){

  width:100px;

  text-align:center;

}

.items-table th:nth-child(4){

  width:130px;

  text-align:right;

}

.items-table td{

  padding:13px 12px;

  border-bottom:1px solid #e2e8f0;

  font-size:13px;

  vertical-align:top;

}

.items-table td:nth-child(1){

  text-align:center;

}

.items-table td:nth-child(3){

  text-align:center;

}

.items-table td:nth-child(4){

  text-align:right;

  font-weight:600;

}

.item-name{

  font-weight:700;

  color:#334155;

  font-size:13px;

}

.item-description{

  margin-top:4px;

  color:#64748b;

  font-size:11px;

}


/* =====================================================
   TOTAL
===================================================== */

.total-area{

  display:flex;

  justify-content:flex-end;

  margin-top:22px;

}

.total-box{

  width:310px;

  border-top:2px solid #102a43;

  border-bottom:2px solid #102a43;

  background:#f1f5f9;

  padding:11px 15px;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.total-label{

  font-size:16px;

  font-weight:700;

  color:#526174;

}

.total-value{

  font-size:17px;

  font-weight:800;

  color:#102a43;

}


/* =====================================================
   FOOTER
===================================================== */

.footer-area{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  margin-top:35px;

  padding-top:18px;

  border-top:1px dashed #cbd5e1;

  min-height:100px;

}

.footer-note{

  font-size:13px;

  font-weight:700;

  color:#475569;

  line-height:1.6;

}

.footer-note small{

  display:block;

  margin-top:4px;

  font-size:11px;

  font-weight:400;

  font-style:italic;

  color:#94a3b8;

}


/* =====================================================
   PAID STAMP
===================================================== */

.paid-stamp{

  border:3px solid #3da66a;

  color:#3da66a;

  font-size:26px;

  font-weight:900;

  letter-spacing:4px;

  padding:7px 17px;

  transform:rotate(-15deg);

  border-radius:7px;

  margin-right:20px;

  margin-top:-10px;

}


/* =====================================================
   PRINT BUTTON
===================================================== */

.print-button{

  display:block;

  margin:30px auto 10px;

  border:none;

  border-radius:6px;

  padding:12px 30px;

  background:#102a43;

  color:#ffffff;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

}

.print-button:hover{

  background:#173b5f;

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

  max-width:600px;

  margin:100px auto;

  background:#ffffff;

  padding:30px;

  text-align:center;

  border-radius:8px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.10);

  color:#dc2626;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  body{

    padding:8px;

  }

  .invoice{

    padding:25px 18px;

    margin:5px auto;

  }

  .invoice-header{

    flex-direction:column;

    gap:20px;

  }

  .company-section{

    width:100%;

  }

  .company-logo{

    width:75px;

    height:75px;

  }

  .company-name{

    font-size:23px;

  }

  .invoice-title{

    width:100%;

    text-align:left;

  }

  .invoice-title h1{

    font-size:27px;

  }

  .location-box{

    grid-template-columns:1fr;

    gap:8px;

  }

  .items-table th,
  .items-table td{

    padding:9px 6px;

    font-size:11px;

  }

  .items-table th:nth-child(1){

    width:35px;

  }

  .items-table th:nth-child(3){

    width:55px;

  }

  .items-table th:nth-child(4){

    width:80px;

  }

  .item-name{

    font-size:11px;

  }

  .item-description{

    font-size:9px;

  }

  .total-box{

    width:100%;

  }

  .footer-area{

    flex-direction:column;

    gap:25px;

  }

}


/* =====================================================
   PRINT
===================================================== */

@media print{

  @page{

    size:A4;

    margin:10mm;

  }

  body{

    background:#ffffff;

    padding:0;

  }

  .invoice{

    width:100%;

    max-width:none;

    margin:0;

    padding:15px;

    box-shadow:none;

  }

  .print-button{

    display:none;

  }

}

</style>

</head>


<body>


<div id="billArea"></div>


<script>


/* =====================================================
   GET BILL DATA FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const revenueYear =
  params.get("year") || "-";


const email =
  params.get("email") || "-";


const village =
  params.get("village") || "-";


const taluka =
  params.get("taluka") || "-";


const district =
  params.get("district") || "-";


const requestDate =
  params.get("date") || "-";


const amount =
  params.get("amount") || "799";


/* =====================================================
   INVOICE NUMBER
   REQUEST DATE & TIME USED
===================================================== */

const invoiceNumber =
  requestDate !== "-"
    ? requestDate
    : "-";


/* =====================================================
   VALIDATION
===================================================== */

if(

  revenueYear === "-" &&

  email === "-" &&

  village === "-" &&

  taluka === "-" &&

  district === "-"

){

  document.getElementById(
    "billArea"
  ).innerHTML = `

    <div class="error-box">

      <h2>
        Bill Information Not Found
      </h2>

      <p>
        Please open the Bill using the link received by email.
      </p>

    </div>

  `;

}


/* =====================================================
   CREATE BILL
===================================================== */

else{


  document.getElementById(
    "billArea"
  ).innerHTML = `

    <div class="invoice">


      <!-- ============================================
           HEADER
      ============================================= -->


      <div class="invoice-header">


        <div class="company-section">


          <img
            src="./logo.png"
            class="company-logo"
            alt="Mahamantra Web Services Logo">


          <div class="company-info">


            <h1 class="company-name">

              Mahamantra Web Services<br>
            

            </h1>


            <div class="company-subtitle">

              Web and App Designing

            </div>


            <div class="company-owner">

              Pro. Mrial S Patel

            </div>


            <div class="company-address">

              Add: Gotri, Vadodara (Guj) - 390007

            </div>


            <div class="company-email">

              Email: tcmguidegujarat@gmail.com

            </div>


          </div>


        </div>


        <!-- INVOICE -->


        <div class="invoice-title">


          <h1>
            INVOICE
          </h1>


          <div class="invoice-details">


            <div>

              <span>
                Invoice Date & Time:
              </span>

              ${escapeHTML(invoiceNumber)}

            </div>


          </div>


        </div>


      </div>


      <div class="header-line"></div>


      <!-- ============================================
           VILLAGE / TALUKA / DISTRICT
      ============================================= -->


      <div class="location-box">


        <div class="location-item">

          ગામ:

          <span class="location-value">

            ${escapeHTML(village)}

          </span>

        </div>


        <div class="location-item">

          તાલુકો:

          <span class="location-value">

            ${escapeHTML(taluka)}

          </span>

        </div>


        <div class="location-item">

          જિલ્લો:

          <span class="location-value">

            ${escapeHTML(district)}

          </span>

        </div>


      </div>


      <!-- ============================================
           ITEM TABLE
      ============================================= -->


      <table class="items-table">


        <thead>

          <tr>

            <th>
              Sr.<br>No.
            </th>

            <th>
              Items
            </th>

            <th>
              Quantity
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody>

          <tr>


            <td>
              1
            </td>


            <td>

              <div class="item-name">

                Revenue Hisab bandh web services

              </div>


              <div class="item-description">

                Subscription (Till Jun 2027)- ${escapeHTML(revenueYear)}

              </div>

            </td>


            <td>
              1
            </td>


            <td>

              ₹ ${escapeHTML(amount)}.00

            </td>


          </tr>


        </tbody>


      </table>


      <!-- ============================================
           TOTAL
      ============================================= -->


      <div class="total-area">


        <div class="total-box">


          <div class="total-label">

            Total Amount:

          </div>


          <div class="total-value">

            ₹ ${escapeHTML(amount)}.00

          </div>


        </div>


      </div>


      <!-- ============================================
           FOOTER
      ============================================= -->


      <div class="footer-area">


        <div class="footer-note">


          This is system generated bill, signature not required.


          <small>

            Note: Accuracy and security depends on data provided.

          </small>


        </div>


        <div class="paid-stamp">

          PAID

        </div>


      </div>


      <!-- PRINT -->


      <button
        class="print-button"
        onclick="window.print()">

        🖨 Print Bill

      </button>


    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
